<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around the United States of America</title>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Logo"
          class="page__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="<%=require('./images/jacques-cousteau.jpg')%>"
            alt="jacques-cousteau"
            class="profile__image"
          />
          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button
              class="profile__edit-button"
              id="profile-edit-button"
              type="button"
            ></button>
            <p class="profile__description">Explorer</p>
          </div>
          <button
            class="profile__add-button"
            id="profile-add-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2022 Around the U.S.</p>
      </footer>
    </div>

    <!--Edit Modal-->
    <div class="modal" id="edit-modal">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Edit Profile</p>
        <form class="modal__form" id="profile-edit-form">
          <input
            class="modal__input modal__input_type_name"
            name="name"
            id="profile-name-input"
            placeholder="Name"
            type="text"
            required
            minlength="2"
            maxlength="40"
          />
          <span class="modal__error" id="profile-name-input-error"></span>
          <input
            class="modal__input modal__input_type_description"
            name="about"
            id="profile-description-input"
            placeholder="Description"
            type="text"
            required
            minlength="2"
            maxlength="200"
          />
          <span
            class="modal__error"
            id="profile-description-input-error"
          ></span>
          <button
            class="modal__button modal__button_disabled"
            type="submit"
            disabled
          >
            Save
          </button>
        </form>
      </div>
    </div>

    <!--Add Modal-->
    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">New Place</p>
        <form class="modal__form" id="add-card-form">
          <input
            class="modal__input modal__input_type_title"
            name="name"
            id="add-title-input"
            placeholder="Title"
            type="text"
            required
            minlength="1"
            maxlength="30"
          />
          <span class="modal__error" id="add-title-input-error"></span>
          <input
            class="modal__input modal__input_type_url"
            name="link"
            id="add-description-input"
            placeholder="Image URL"
            type="URL"
            required
            url
          />
          <span class="modal__error" id="add-description-input-error"
            >Please add a valid URL</span
          >
          <button
            class="modal__button modal__button_disabled"
            type="submit"
            disabled
          >
            Save
          </button>
        </form>
      </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal modal_preview" id="preview-modal">
      <div class="modal__container modal__container_image">
        <button class="modal__close" type="button"></button>
        <img src="" class="modal__image" alt="" id="preview-modal-image" />
        <p class="modal__caption" id="preview-modal-title"></p>
      </div>
    </div>

    <!--Javascript.JS-->
    <template id="card-template">
      <li class="card">
        <img src="" alt="" class="card__image" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button class="card__like-button" type="button"></button>
          <button class="card__delete-button" type="button"></button>
        </div>
      </li>
    </template>

    <!--Modal Delete-->
    <div class="modal modal__delete" id="modal-delete">
      <div class="modal__container-delete">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Are you sure?</p>
        <form class="modal__form" id="modal-delete-form"></form>
        <button class="modal__button modal__button_disabled" type="submit">
          Yes
        </button>
      </div>
    </div>

    <!--Modal Profile Picture-->
    <div class="modal modal__profile-picture" id="modal-profile-pic">
      <div class="modal__container-profile-picture">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Change profile picture</p>
        <form class="modal__form" id="modal-change-picture">
          <input
            class="modal__input modal__input_type_title"
            name="URL"
            id="change-profile-picture"
            placeholder="Picture URL"
            type="URL"
            required
            url
          />
          <button class="modal__button modal__button_disabled" type="submit">
            Save
          </button>
        </form>
      </div>
    </div>
    <!-- <script src="./scripts/validation.js" defer></script> -->
  </body>
</html>
